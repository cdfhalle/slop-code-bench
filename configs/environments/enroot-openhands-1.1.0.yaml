type: enroot
name: openhands-1.1.0
enroot:
  # Layer baked by SCB_BAKE_AGENT=openhands onto slop-code-python3.12.sqsh.
  image: ${SCB_IMAGE_STORE}/slop-code-openhands-1.1.0.sqsh
  slirp_binary: ${SCB_SLIRP}
  workdir: /workspace
  mount_workspace: true
environment:
  env:
    # Inside the container rootfs. enroot hides /tmp with a fresh tmpfs.
    UV_CACHE_DIR: /opt/cache/uv
    PIP_CACHE_DIR: /opt/cache/pip
    PIP_CONFIG_FILE: /opt/cache/pip.conf
setup:
  eval_commands:
    - uv init
    - uv add -r requirements.txt
  resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
commands:
  entry_file: "{entry_file}.py"
  command: uv run
  agent_command: "python"
